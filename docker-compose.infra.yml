services:
  postgres:
    image: postgres:16-alpine
    container_name: transcriptor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transcriptor_db
      POSTGRES_USER: transcriptor
      POSTGRES_PASSWORD: transcriptor123
    ports:
      - "5432:5432"
    volumes:
      - transcriptor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcriptor -d transcriptor_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: transcriptor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - transcriptor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  transcriptor_postgres_data:
  transcriptor_redis_data:
